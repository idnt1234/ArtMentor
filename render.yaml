services:
  - type: web
    name: artmentor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: AI_PROVIDER
        value: gptsapi
      - key: GPTSAPI_BASE_URL
        value: https://api.gptsapi.net/v1
      - key: GPTSAPI_MODEL
        value: gpt-5.6-terra
      - key: GPTSAPI_KEY
        sync: false
      - key: ALLOW_DEMO_FALLBACK
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT
        value: https://xvmyxrwipzlqtljnkkhj.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: ap-northeast-1
      - key: S3_BUCKET
        value: artmentor-artworks
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Supabase Auth is optional until both values are present. The publishable
      # key is browser-safe; never substitute a secret/service-role key.
      - key: SUPABASE_URL
        value: https://xvmyxrwipzlqtljnkkhj.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Server-only; used only after a user confirms permanent account deletion.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REQUIRE_ACCOUNT_FOR_WORK
        value: "true"
      - key: ACCOUNT_DAILY_AI_LIMIT
        value: "5"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ACCOUNT_COOKIE_MAX_AGE
        value: "604800"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: ANALYSIS_MAX_SIDE
        value: "1600"
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "12"
      - key: UPLOAD_RATE_LIMIT_PER_HOUR
        value: "8"
      - key: MAX_CONCURRENT_AI_REQUESTS
        value: "1"
      # GPU body checks remain hidden until both private values are configured.
      - key: POSE_FEATURE_ENABLED
        value: "false"
      - key: POSE_PROVIDER
        value: worker
      - key: POSE_WORKER_URL
        sync: false
      - key: POSE_WORKER_TOKEN
        sync: false
      - key: POSE_WORKER_TIMEOUT_SECONDS
        value: "45"
      # Single-image 3D is a private research beta. Enabling the flag alone is
      # insufficient: the signed-in email must also be explicitly allowlisted.
      - key: POSE3D_FEATURE_ENABLED
        value: "false"
      - key: POSE3D_ALLOWED_EMAILS
        sync: false
      - key: POSE3D_WORKER_URL
        sync: false
      - key: POSE3D_WORKER_TOKEN
        sync: false
      - key: POSE3D_WORKER_TIMEOUT_SECONDS
        value: "180"
